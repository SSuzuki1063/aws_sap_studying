name: PR Quality Check

on:
  pull_request:
    branches:
      - gh-pages
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '**.css'
      - '**.py'
      - 'astro.config.mjs'
      - 'package.json'

# Opt JavaScript actions (checkout, setup-node) into Node 24
# until upstream releases Node 24-targeted action versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml html5lib

      - name: Install Node dependencies
        run: npm ci

      - name: Build site (generate data + astro build)
        run: npm run build

      - name: W3C HTML Validation (dist output)
        run: |
          python3 scripts/ci/validate_html_w3c.py --pr-mode --base-dir dist
        continue-on-error: false

      - name: Accessibility - Color Contrast Check
        run: |
          python3 scripts/accessibility/check_contrast_ratio.py --base-dir dist
        continue-on-error: false

      - name: Accessibility - Heading Hierarchy Check
        run: |
          python3 scripts/accessibility/check_heading_hierarchy.py --base-dir dist
        continue-on-error: true  # Warning only

      - name: JavaScript Syntax Check
        run: |
          node -c public/quiz-data-extended.js
          node -c public/data.js
          node -c public/render.js
          node -c public/index.js
          node -c public/quiz-app.js
        continue-on-error: false

      - name: Internal Links Validation
        run: |
          python3 scripts/ci/check_internal_links.py --base-dir dist
        continue-on-error: true  # Warning only

      - name: File Naming Convention Check
        run: |
          python3 scripts/ci/check_file_naming.py
        continue-on-error: true  # Warning only

      - name: Generate Quality Report
        if: always()
        run: |
          echo "## Quality Check Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All critical checks completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks Performed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Astro Build (data generation + SSG)" >> "$GITHUB_STEP_SUMMARY"
          echo "- W3C HTML Validation (dist output)" >> "$GITHUB_STEP_SUMMARY"
          echo "- WCAG 2.1 AA Accessibility" >> "$GITHUB_STEP_SUMMARY"
          echo "- JavaScript Syntax" >> "$GITHUB_STEP_SUMMARY"
          echo "- Internal Links" >> "$GITHUB_STEP_SUMMARY"
          echo "- File Naming Conventions" >> "$GITHUB_STEP_SUMMARY"
