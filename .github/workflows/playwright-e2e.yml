name: Playwright E2E Tests

on:
  push:
    paths:
      - 'concept-map.html'
      - 'js/concept-engine/**'
      - 'concepts/**'
      - 'css/pages/mindmap.css'
      - 'css/pages/concept-map.css'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'concept-map.html'
      - 'js/concept-engine/**'
      - 'concepts/**'
      - 'css/pages/mindmap.css'
      - 'css/pages/concept-map.css'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local server
        run: |
          python3 server.py &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 0.5
          done

      - name: Run Playwright tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 7

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/**/*.webm
          retention-days: 7

      - name: Write GitHub Step Summary
        if: always()
        run: |
          RESULTS_FILE="playwright-report/results.json"
          if [ -f "$RESULTS_FILE" ]; then
            PASSED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('stats',{}).get('expected',0))")
            FAILED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('stats',{}).get('unexpected',0))")
            TOTAL=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); s=d.get('stats',{}); print(s.get('expected',0)+s.get('unexpected',0)+s.get('skipped',0))")
            echo "## Playwright E2E Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Passed | $PASSED |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Failed | $FAILED |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total  | $TOTAL  |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Playwright E2E Results" >> "$GITHUB_STEP_SUMMARY"
            echo "Results file not found." >> "$GITHUB_STEP_SUMMARY"
          fi
