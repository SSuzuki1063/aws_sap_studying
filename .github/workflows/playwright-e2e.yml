name: Playwright E2E Tests

on:
  push:
    branches: [master]
    paths:
      - 'src/pages/**'
      - 'public/js/**'
      - 'public/css/**'
      - 'concepts/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/pages/**'
      - 'public/js/**'
      - 'public/css/**'
      - 'concepts/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Opt JavaScript actions (checkout, setup-node, upload-artifact) into Node 24
# until upstream releases Node 24-targeted action versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  playwright-e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (Chromium)
        run: >-
          npx playwright test --project=chromium
          tests/e2e/concept-map/
          tests/e2e/navigation/
          tests/e2e/links/
          tests/e2e/interaction/
        env:
          CI: true
          TZ: UTC
          LANG: en_US.UTF-8

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/**/*.png
          retention-days: 7

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: test-results/**/*.webm
          retention-days: 7

      - name: Write GitHub Step Summary
        if: always()
        run: |
          RESULTS_FILE="playwright-report/results.json"
          if [ -f "$RESULTS_FILE" ]; then
            PASSED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('stats',{}).get('expected',0))")
            FAILED=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); print(d.get('stats',{}).get('unexpected',0))")
            TOTAL=$(python3 -c "import json; d=json.load(open('$RESULTS_FILE')); s=d.get('stats',{}); print(s.get('expected',0)+s.get('unexpected',0)+s.get('skipped',0))")
            echo "## Playwright E2E Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Passed | $PASSED |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Failed | $FAILED |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total  | $TOTAL  |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Playwright E2E Results" >> "$GITHUB_STEP_SUMMARY"
            echo "Results file not found." >> "$GITHUB_STEP_SUMMARY"
          fi
