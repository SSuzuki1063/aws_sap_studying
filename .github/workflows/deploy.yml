name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages-deploy
  cancel-in-progress: true

# Grant GITHUB_TOKEN permissions for gh-pages push
permissions:
  contents: write

# Opt JavaScript actions (checkout, setup-node, upload-artifact) into Node 24
# until upstream releases Node 24-targeted action versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking critical assets in dist/..."
          missing=0
          for f in \
            dist/css/variables.css \
            dist/css/common.css \
            dist/css/layout.css \
            dist/css/responsive.css \
            dist/js/mobile-nav.js \
            dist/js/concept-engine/MindmapController.js \
            dist/concept-map.html \
            dist/index.html \
            dist/data.js; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Build output is missing $missing critical file(s). Aborting deploy."
            exit 1
          fi
          echo "All critical assets present"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
