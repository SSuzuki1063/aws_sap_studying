# Dependabot version updates.
# Monthly and grouped to keep PR volume low: merging to master deploys the site.
# Security updates are enabled separately in the repo settings and are not
# bound by this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
