<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>AWS概念マップ｜階層用語集エンジン</title>
  <meta name="description" content="AWSサービスを設計軸・ドメイン・サービス・重要概念・キーワードの5階層で整理した知識エンジン。SAP試験対策に最適。"/>
  <link href="/aws_sap_studying/css/variables.css" rel="stylesheet"/>
  <link href="/aws_sap_studying/css/common.css" rel="stylesheet"/>
  <link href="/aws_sap_studying/css/layout.css" rel="stylesheet"/>
  <link href="/aws_sap_studying/css/responsive.css" rel="stylesheet"/>
  <link href="/aws_sap_studying/css/pages/concept-map.css" rel="stylesheet"/>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="home-link" href="/aws_sap_studying/">
        <span class="home-icon" aria-hidden="true">🏠</span>
        ホームへ戻る
      </a>
      <h1 class="page-title">AWS概念マップ</h1>
    </div>
  </header>

  <main class="concept-map-main">

    <!-- 検索バー -->
    <section class="search-section" aria-label="概念検索">
      <div class="search-bar-wrapper">
        <label class="sr-only" for="concept-search">AWS概念を検索</label>
        <input
          type="search"
          id="concept-search"
          class="concept-search-input"
          placeholder="概念・サービス・キーワードを検索（例：フェイルオーバー）"
          autocomplete="off"
          aria-label="AWS概念を検索"
          aria-controls="search-results"
          aria-autocomplete="list"
        />
        <span class="search-icon" aria-hidden="true">🔍</span>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="検索結果" hidden></div>
      <p id="search-empty" class="search-empty" hidden>一致する概念が見つかりませんでした</p>
    </section>

    <!-- タグフィルタパネル -->
    <section class="tag-filter-section" aria-label="タグフィルタ">
      <div class="tag-filter-inner">
        <div class="tag-group">
          <h2 class="tag-group-label">設計軸フィルタ</h2>
          <div id="axis-tag-buttons" class="tag-buttons" role="group" aria-label="設計軸タグフィルタ">
            <!-- JS で動的生成 -->
          </div>
        </div>
        <div class="tag-group">
          <h2 class="tag-group-label">SAP試験ドメイン</h2>
          <div id="sap-tag-buttons" class="tag-buttons" role="group" aria-label="SAPドメインタグフィルタ">
            <!-- JS で動的生成 -->
          </div>
        </div>
        <button id="clear-filters-btn" class="clear-filters-btn" type="button" hidden>
          ✕ フィルタをクリア
        </button>
      </div>
    </section>

    <!-- アコーディオンツリー -->
    <section class="concept-tree-section" aria-label="AWS概念階層ツリー">
      <div id="concept-tree" class="concept-tree" role="tree" aria-label="AWS概念ツリー">
        <p class="loading-msg" id="loading-msg">概念マップを読み込み中...</p>
      </div>
    </section>

  </main>

  <script src="/aws_sap_studying/js/concept-engine/ConceptLoader.js"></script>
  <script src="/aws_sap_studying/js/concept-engine/ConceptIndex.js"></script>
  <script src="/aws_sap_studying/js/concept-engine/CrossLinkResolver.js"></script>
  <script src="/aws_sap_studying/js/concept-engine/SearchEngine.js"></script>
  <script src="/aws_sap_studying/js/concept-engine/TagSystem.js"></script>
  <script>
  /* ============================================================
   * AWS概念マップ — メインコントローラー
   * contracts/js-engine-api.md 初期化シーケンスに準拠
   * ============================================================ */
  'use strict';

  /* ── エントリポイント ─────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    ConceptEngine.loader.loadConceptIndex().then(function (manifest) {
      if (!manifest) {
        var msg = document.getElementById('loading-msg');
        if (msg) { msg.textContent = 'データの読み込みに失敗しました。'; }
        return;
      }
      ConceptEngine.index.init(manifest);
      var msg = document.getElementById('loading-msg');
      if (msg) { msg.remove(); }
      renderConceptTree();
      renderTagFilterPanel();
      initSearchBar();
    });
  });

  /* ============================================================
   * DOM ヘルパー — innerHTML を使わず DOM API で構築
   * ============================================================ */
  function _el(tag, opts) {
    var el = document.createElement(tag);
    if (opts) {
      if (opts.cls)  { el.className = opts.cls; }
      if (opts.text) { el.textContent = opts.text; }
      if (opts.role) { el.setAttribute('role', opts.role); }
      if (opts.hidden) { el.hidden = true; }
    }
    return el;
  }

  function _badge(layerNum, label) {
    var span = _el('span', { cls: 'layer-badge l' + layerNum + '-badge', text: label || ('L' + layerNum) });
    return span;
  }

  function _arrow() {
    var span = _el('span', { cls: 'tree-arrow', text: '▶' });
    span.setAttribute('aria-hidden', 'true');
    return span;
  }

  /* ============================================================
   * タグフィルタパネル (US3)
   * ============================================================ */
  var SAP_DOMAINS = [
    { id: 'sap-d1-org-governance',   name: 'D1: 組織・ガバナンス' },
    { id: 'sap-d2-new-solutions',     name: 'D2: 新ソリューション' },
    { id: 'sap-d3-migration',         name: 'D3: 移行計画' },
    { id: 'sap-d4-cost-optimization', name: 'D4: コスト最適化' },
  ];

  function renderTagFilterPanel() {
    var axisBtnEl = document.getElementById('axis-tag-buttons');
    var sapBtnEl  = document.getElementById('sap-tag-buttons');
    var clearBtn  = document.getElementById('clear-filters-btn');

    ConceptEngine.index.getByLayer(0).forEach(function (axis) {
      var btn = _el('button', { cls: 'tag-btn axis-tag-btn', text: axis.name_ja });
      btn.type = 'button';
      btn.dataset.tagId = axis.id;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', function () {
        ConceptEngine.tags.toggleAxisTag(axis.id);
        var isNowActive = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(isNowActive));
        btn.classList.toggle('active', isNowActive);
        _syncClearBtn();
      });
      axisBtnEl.appendChild(btn);
    });

    SAP_DOMAINS.forEach(function (dom) {
      var btn = _el('button', { cls: 'tag-btn sap-tag-btn', text: dom.name });
      btn.type = 'button';
      btn.dataset.domainId = dom.id;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', function () {
        ConceptEngine.tags.toggleSapDomain(dom.id);
        var isNowActive = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(isNowActive));
        btn.classList.toggle('active', isNowActive);
        _syncClearBtn();
      });
      sapBtnEl.appendChild(btn);
    });

    clearBtn.addEventListener('click', function () {
      ConceptEngine.tags.clearAll();
      document.querySelectorAll('.tag-btn.active').forEach(function (b) {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      _syncClearBtn();
    });

    ConceptEngine.tags.onChange(function () { applyFilters(); });
  }

  function _syncClearBtn() {
    var f = ConceptEngine.tags.getActiveFilters();
    document.getElementById('clear-filters-btn').hidden =
      f.axisTags.length === 0 && f.sapDomains.length === 0;
  }

  /* ============================================================
   * フィルタ適用 (US3)
   * ============================================================ */
  function applyFilters() {
    document.querySelectorAll('.service-item').forEach(function (el) {
      var entry = ConceptEngine.index.getById(el.dataset.id);
      var matches = entry ? ConceptEngine.tags.matchesNode(entry) : true;
      el.style.display = matches ? '' : 'none';
    });

    document.querySelectorAll('.domain-item').forEach(function (domEl) {
      var svcs = domEl.querySelectorAll('.service-item');
      if (!svcs.length) { return; }
      var anyVisible = Array.prototype.some.call(svcs, function (s) {
        return s.style.display !== 'none';
      });
      domEl.classList.toggle('domain-dimmed', !anyVisible);
    });
  }

  /* ============================================================
   * 概念ツリー描画 (US1)
   * ============================================================ */
  function renderConceptTree() {
    var tree = document.getElementById('concept-tree');
    while (tree.firstChild) { tree.removeChild(tree.firstChild); }

    var domains = ConceptEngine.index.getByLayer(1);
    if (!domains.length) {
      tree.textContent = 'ドメインデータが見つかりませんでした。';
      return;
    }
    domains.forEach(function (domain) {
      tree.appendChild(_makeDomainItem(domain));
    });
  }

  /* Layer1 ドメイン */
  function _makeDomainItem(domain) {
    var item = _el('div', { cls: 'tree-item domain-item layer1-item' });
    item.dataset.id = domain.id;
    item.setAttribute('role', 'treeitem');
    item.setAttribute('aria-expanded', 'false');

    var btn = _el('button', { cls: 'tree-btn domain-btn' });
    btn.type = 'button';
    btn.setAttribute('aria-controls', 'children-' + domain.id);
    var arrow = _arrow();
    btn.appendChild(arrow);
    btn.appendChild(_badge(1));
    var nameJa = _el('span', { cls: 'node-name-ja', text: domain.name_ja });
    var nameEn = _el('span', { cls: 'node-name-en', text: domain.name_en });
    btn.appendChild(nameJa);
    btn.appendChild(nameEn);

    var children = _el('div', { cls: 'tree-children' });
    children.id = 'children-' + domain.id;
    children.hidden = true;

    var loaded = false;
    btn.addEventListener('click', function () {
      var isOpen = item.getAttribute('aria-expanded') === 'true';
      if (!isOpen && !loaded) {
        _renderServiceList(domain, children);
        loaded = true;
      }
      var nowOpen = !isOpen;
      item.setAttribute('aria-expanded', String(nowOpen));
      arrow.textContent = nowOpen ? '▼' : '▶';
      children.hidden = !nowOpen;
    });

    item.appendChild(btn);
    item.appendChild(children);
    return item;
  }

  /* Layer2 サービス一覧 */
  function _renderServiceList(domain, container) {
    var services = ConceptEngine.index.getByLayer(2).filter(function (s) {
      return s.parent_domain_id === domain.id;
    });

    if (!services.length) {
      container.appendChild(_el('p', { cls: 'empty-children-msg', text: 'このドメインにはまだサービスがありません' }));
      return;
    }
    services.forEach(function (svc) {
      container.appendChild(_makeServiceItem(svc));
    });
  }

  /* Layer2 サービス */
  function _makeServiceItem(svc) {
    var item = _el('div', { cls: 'tree-item service-item layer2-item' });
    item.dataset.id = svc.id;
    item.setAttribute('role', 'treeitem');
    item.setAttribute('aria-expanded', 'false');

    var btn = _el('button', { cls: 'tree-btn service-btn' });
    btn.type = 'button';
    btn.setAttribute('aria-controls', 'children-' + svc.id);
    var arrow = _arrow();
    btn.appendChild(arrow);
    btn.appendChild(_badge(2));
    btn.appendChild(_el('span', { cls: 'node-name-ja', text: svc.name_ja }));
    btn.appendChild(_el('span', { cls: 'node-name-en', text: svc.name_en }));

    /* 軸タグのミニバッジ */
    if (svc.axis_tags && svc.axis_tags.length) {
      var badgeWrap = _el('span', { cls: 'axis-mini-badges' });
      badgeWrap.setAttribute('aria-hidden', 'true');
      svc.axis_tags.forEach(function (t) {
        var b = _el('span', { cls: 'axis-mini-badge', text: t.replace('axis-', '').slice(0, 4) });
        badgeWrap.appendChild(b);
      });
      btn.appendChild(badgeWrap);
    }

    var children = _el('div', { cls: 'tree-children' });
    children.id = 'children-' + svc.id;
    children.hidden = true;

    var loaded = false;
    btn.addEventListener('click', function () {
      var isOpen = item.getAttribute('aria-expanded') === 'true';
      if (!isOpen && !loaded) {
        ConceptEngine.loader.loadServiceNode(svc.id).then(function (node) {
          if (!node) {
            children.appendChild(_el('p', { cls: 'empty-children-msg', text: 'サービスデータの読み込みに失敗しました' }));
          } else {
            ConceptEngine.resolver.build([node]);
            _renderConceptList(node, children);
            _renderCrossLinks(svc.id, children);
          }
          loaded = true;
        });
      }
      var nowOpen = !isOpen;
      item.setAttribute('aria-expanded', String(nowOpen));
      arrow.textContent = nowOpen ? '▼' : '▶';
      children.hidden = !nowOpen;
    });

    item.appendChild(btn);
    item.appendChild(children);
    return item;
  }

  /* Layer3 概念一覧 */
  function _renderConceptList(svcNode, container) {
    if (svcNode.sap_tip) {
      var tipEl = _el('p', { cls: 'sap-tip service-sap-tip' });
      var tipLabel = _el('span', { cls: 'sap-tip-label', text: 'SAP Tip' });
      tipEl.appendChild(tipLabel);
      tipEl.appendChild(document.createTextNode(' ' + svcNode.sap_tip));
      container.appendChild(tipEl);
    }
    (svcNode.key_concepts || []).forEach(function (concept) {
      container.appendChild(_makeConceptItem(concept));
    });
  }

  /* Layer3 概念アイテム */
  function _makeConceptItem(concept) {
    var item = _el('div', { cls: 'tree-item concept-item layer3-item' });
    item.dataset.id = concept.id;
    item.setAttribute('role', 'treeitem');
    item.setAttribute('aria-expanded', 'false');

    var btn = _el('button', { cls: 'tree-btn concept-btn' });
    btn.type = 'button';
    btn.setAttribute('aria-controls', 'children-' + concept.id);
    var arrow = _arrow();
    btn.appendChild(arrow);
    btn.appendChild(_badge(3));
    btn.appendChild(_el('span', { cls: 'node-name-ja', text: concept.name_ja }));
    btn.appendChild(_el('span', { cls: 'node-name-en', text: concept.name_en }));

    var children = _el('div', { cls: 'tree-children' });
    children.id = 'children-' + concept.id;
    children.hidden = true;

    if (concept.description_ja) {
      children.appendChild(_el('p', { cls: 'concept-desc', text: concept.description_ja }));
    }
    if (concept.sap_tip) {
      var tip = _el('p', { cls: 'sap-tip' });
      tip.appendChild(_el('span', { cls: 'sap-tip-label', text: 'SAP Tip' }));
      tip.appendChild(document.createTextNode(' ' + concept.sap_tip));
      children.appendChild(tip);
    }
    (concept.keywords || []).forEach(function (kw) {
      children.appendChild(_makeKeywordItem(kw));
    });

    btn.addEventListener('click', function () {
      var isOpen = item.getAttribute('aria-expanded') === 'true';
      var nowOpen = !isOpen;
      item.setAttribute('aria-expanded', String(nowOpen));
      arrow.textContent = nowOpen ? '▼' : '▶';
      children.hidden = !nowOpen;
    });

    item.appendChild(btn);
    item.appendChild(children);
    return item;
  }

  /* Layer4 キーワードアイテム */
  function _makeKeywordItem(kw) {
    var item = _el('div', { cls: 'tree-item keyword-item layer4-item' });
    item.dataset.id = kw.id;
    item.setAttribute('role', 'treeitem');

    var content = _el('div', { cls: 'keyword-content' });
    content.appendChild(_badge(4));
    content.appendChild(_el('span', { cls: 'node-name-ja', text: kw.name_ja }));
    content.appendChild(_el('span', { cls: 'node-name-en', text: kw.name_en }));
    if (kw.description_ja) {
      content.appendChild(_el('p', { cls: 'keyword-desc', text: kw.description_ja }));
    }

    item.appendChild(content);
    return item;
  }

  /* ============================================================
   * クロスリンクバッジ (US4)
   * ============================================================ */
  function _renderCrossLinks(serviceId, container) {
    var outbound = ConceptEngine.resolver.getOutbound(serviceId);
    if (!outbound.length) { return; }

    var section = _el('div', { cls: 'crosslink-section' });
    section.appendChild(_el('p', { cls: 'crosslink-label', text: '関連サービス' }));

    outbound.forEach(function (cl) {
      var badge = _el('button', { cls: 'crosslink-badge crosslink-type-' + cl.type });
      badge.type = 'button';
      badge.dataset.targetId = cl.target_id;
      badge.title = cl.description_ja || '';
      badge.textContent = cl.target_id.replace('svc-', '').toUpperCase() + ' (' + cl.type + ')';
      badge.addEventListener('click', function () { _scrollToNode(cl.target_id); });
      section.appendChild(badge);
    });

    container.insertBefore(section, container.firstChild);
  }

  /* ============================================================
   * スクロール＆展開 (US4 / US2)
   * ============================================================ */
  function _scrollToNode(nodeId) {
    var el = document.querySelector('[data-id="' + nodeId + '"]');
    if (!el) { return; }

    /* 祖先の hidden な children を開く */
    var cur = el.parentElement;
    while (cur && cur.id !== 'concept-tree') {
      if (cur.hidden === true) {
        cur.hidden = false;
        var prevBtn = cur.previousElementSibling;
        if (prevBtn && prevBtn.classList.contains('tree-btn')) {
          var arw = prevBtn.querySelector('.tree-arrow');
          if (arw) { arw.textContent = '▼'; }
          var treeItem = prevBtn.parentElement;
          if (treeItem) { treeItem.setAttribute('aria-expanded', 'true'); }
        }
      }
      cur = cur.parentElement;
    }

    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('node-highlight');
    setTimeout(function () { el.classList.remove('node-highlight'); }, 2000);
  }

  /* ============================================================
   * 検索バー (US2)
   * ============================================================ */
  var _searchIndexLoaded = false;
  var _searchDebounce    = null;

  function initSearchBar() {
    var input     = document.getElementById('concept-search');
    var resultsEl = document.getElementById('search-results');
    var emptyEl   = document.getElementById('search-empty');

    /* 初回フォーカスで遅延ロード */
    input.addEventListener('focus', function onFirstFocus() {
      input.removeEventListener('focus', onFirstFocus);
      if (!_searchIndexLoaded) {
        _searchIndexLoaded = true;
        ConceptEngine.loader.loadSearchIndex().then(function (entries) {
          ConceptEngine.search.init(entries);
        });
      }
    });

    /* 300ms デバウンス */
    input.addEventListener('input', function () {
      clearTimeout(_searchDebounce);
      var q = input.value.trim();
      if (!q || q.length < 3) {
        resultsEl.hidden = true;
        emptyEl.hidden = true;
        return;
      }
      _searchDebounce = setTimeout(function () {
        if (!ConceptEngine.search.isReady()) { return; }
        _renderSearchResults(ConceptEngine.search.search(q), resultsEl, emptyEl);
      }, 300);
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search-section')) {
        resultsEl.hidden = true;
        emptyEl.hidden = true;
      }
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        resultsEl.hidden = true;
        emptyEl.hidden = true;
        input.value = '';
      }
    });
  }

  function _renderSearchResults(results, resultsEl, emptyEl) {
    while (resultsEl.firstChild) { resultsEl.removeChild(resultsEl.firstChild); }

    if (!results.length) {
      resultsEl.hidden = true;
      emptyEl.hidden = false;
      return;
    }

    emptyEl.hidden = true;
    results.slice(0, 20).forEach(function (r) {
      var item = _el('div', { cls: 'search-result-item', role: 'option' });
      item.setAttribute('tabindex', '0');
      item.appendChild(_badge(r.layer));
      item.appendChild(_el('span', { cls: 'result-name-ja', text: r.name_ja }));
      if (r.name_en && r.name_en !== r.name_ja) {
        item.appendChild(_el('span', { cls: 'result-name-en', text: r.name_en }));
      }
      item.addEventListener('click', function () {
        resultsEl.hidden = true;
        emptyEl.hidden = true;
        document.getElementById('concept-search').value = '';
        _scrollToNode(r.id);
      });
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); }
      });
      resultsEl.appendChild(item);
    });

    resultsEl.hidden = false;
  }
  </script>
</body>
</html>
