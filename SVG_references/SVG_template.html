<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/>
    </marker>

    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <style>
      .title {
        font-family: Inter, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #0F172A;
      }
      .caption {
        font-family: Inter, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #475569;
      }
      .node-title {
        font-family: Inter, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #1E293B;
      }
      .node-sub {
        font-family: Inter, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #475569;
      }
      .step-circle {
        fill: #3B82F6;
      }
      .step-text {
        font-family: Inter, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: white;
      }
      .panel {
        fill: #F8FAFC;
      }
    </style>
  </defs>

  <!-- page background -->
  <rect x="0" y="0" width="1200" height="640" fill="#F3F4F6"/>

  <!-- outer card -->
  <rect x="24" y="24" width="1152" height="592" rx="22" fill="#FFFFFF" filter="url(#shadow-soft)"/>

  <!-- title -->
  <text x="600" y="70" text-anchor="middle" class="title">図タイトル</text>

  <!-- inner panel -->
  <rect x="40" y="92" width="1120" height="500" rx="18" class="panel"/>

  <!-- nodes area -->
  <!-- x positions example: 80, 360, 640, 920 -->
  <!-- y positions example: 200, 360 -->

  <!-- example node -->
  <g class="node">
    <rect x="80" y="200" width="220" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="190" y="236" text-anchor="middle" dominant-baseline="middle" class="node-title">
      <tspan x="190" dy="0">ノード名</tspan>
    </text>
    <text x="190" y="270" text-anchor="middle" dominant-baseline="middle" class="node-sub">
      <tspan x="190" dy="0">補足情報</tspan>
    </text>
  </g>
</svg>
